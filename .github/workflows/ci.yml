name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: weeks/week1

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: weeks/week1/requirements.txt

      - name: install
        run: pip install -r requirements.txt

      - name: unit tests
        run: python -m pytest -q

      - name: regenerate extract and run pipeline
        # the seeded generator must reproduce the committed extract, and the
        # pipeline must exit zero, which means no critical check failed
        run: |
          python -m src.make_sample_data
          git diff --exit-code data/raw/shipments_raw.csv
          python -m src.run_pipeline

      - name: upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: weeks/week1/reports/data_quality_report.md

  week4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weeks/week4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: weeks/week4/requirements.txt

      - name: install
        run: pip install -r requirements.txt

      - name: unit tests
        run: python -m pytest -q

      - name: run pipeline and build report
        run: |
          python -m src.run_pipeline
          python -m src.build_report
          python -m src.audit_report_numbers
          test -f reports/Week4_Decision_Support_Report.docx
